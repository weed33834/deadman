[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deadman"
version = "5.1.0"
description = "deadman - 身后事多智能体引导平台（不绑定任何厂商，适用于所有支持 agent 的平台）"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "deadman Team"}]
keywords = ["deadman", "aftercare", "agent", "multi-agent", "mcp", "langgraph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Topic :: Other/Nonlisted Topic",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # MCP 协议
    "mcp>=1.0",
    "fastmcp>=2.0",
    # LangGraph 编排
    "langgraph>=1.0",
    "langchain-core>=1.0",
    # 可观测性
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp>=1.30",
    # 知识图谱
    # lightrag 和 graphiti 按需安装，不强制
    # 评估
    "pyyaml>=6.0",
    "pydantic>=2.5",
    # LLM 官方 SDK（多厂商统一封装 + fallback）
    "openai>=1.50",
    "anthropic>=0.50",
    # 工具
    "httpx>=0.28",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "ruff>=0.15",
]
lightrag = ["lightrag-hku>=1.0"]
graphiti = ["graphiti-core>=0.5"]
langfuse = ["langfuse>=4.0"]
openai = ["openai>=1.50"]
anthropic = ["anthropic>=0.50"]
sqlite-checkpoint = ["langgraph-checkpoint-sqlite>=3.0"]
mcp = ["fastmcp>=2.0", "duckduckgo-search>=8.0"]
ragas = ["ragas>=0.1", "datasets>=2.0"]
all = [
    "deadman[dev,lightrag,graphiti,langfuse,openai,anthropic,sqlite-checkpoint,mcp,ragas]",
]

[project.scripts]
deadman = "deadman.cli:main"
deadman-mcp-server = "deadman.mcp_server.server:main"
deadman-a2a-server = "deadman.a2a.server:main"
deadman-web-server = "deadman.web.server:main"

[tool.setuptools.packages.find]
where = [".traecli/src"]
include = ["deadman*"]

[tool.setuptools.package-data]
deadman = ["web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
