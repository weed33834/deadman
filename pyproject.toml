[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deadman"
version = "5.1.0"
description = "deadman - 身后事多智能体引导平台（不绑定任何厂商，适用于所有支持 agent 的平台）"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "deadman Team"}]
keywords = ["deadman", "aftercare", "agent", "multi-agent", "mcp", "langgraph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Topic :: Other/Nonlisted Topic",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # MCP 协议（fastmcp>=3.0 用于 @mcp.tool_auto 自动 schema 生成，v5.1 P8 引入）
    "mcp>=1.0",
    "fastmcp>=3.0",
    # LangGraph 编排
    "langgraph>=1.0",
    "langchain-core>=1.0",
    # 可观测性
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp>=1.30",
    # 知识图谱
    # lightrag 和 graphiti 按需安装，不强制
    # 评估
    "pyyaml>=6.0",
    "pydantic>=2.5",
    # LLM 官方 SDK（多厂商统一封装 + fallback）
    "openai>=1.50",
    "anthropic>=0.50",
    # 工具
    "httpx>=0.28",
    "tenacity>=9.0",
    # HTML 解析（替代 web_search 中手写正则解析）
    "beautifulsoup4>=4.12",
    # JWT 会话管理（替代手写 HMAC 实现）
    "PyJWT>=2.8",
    # Cron 表达式解析（替代手写 5 字段解析器）
    "croniter>=2.0",
    # AES-CBC 加密（WeChat 消息加密 / ending_note 生产级加密）
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "ruff>=0.15",
]
lightrag = ["lightrag-hku>=1.0"]
graphiti = ["graphiti-core>=0.5"]
langfuse = ["langfuse>=4.0"]
sqlite-checkpoint = ["langgraph-checkpoint-sqlite>=3.0"]
mcp = ["fastmcp>=3.0", "duckduckgo-search>=8.0"]
ragas = ["ragas>=0.2,<1.0", "datasets>=2.0", "langchain-community<0.4"]
all = [
    "deadman[dev,lightrag,graphiti,langfuse,sqlite-checkpoint,mcp,ragas]",
]

[project.scripts]
deadman = "deadman.cli:main"
deadman-mcp-server = "deadman.mcp_server.server:main"
deadman-a2a-server = "deadman.a2a.server:main"
deadman-web-server = "deadman.web.server:main"

[tool.setuptools.packages.find]
where = [".traecli/src"]
include = ["deadman*"]

[tool.setuptools.package-data]
deadman = ["web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [".traecli/src/tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"'). Used for RAGAS / red-team / integration tests that burn tokens.",
    "ragas: marks tests that require ragas package installed.",
    "integration: marks tests that require external services (LLM API / Neo4j / Chroma).",
]
