[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy-aftercare"
version = "4.4.1"
description = "Legacy / 死者为大 / 終活 - 通用身后事多智能体平台（不绑定任何厂商，适用于所有支持 agent 的平台）"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Legacy Team"}]
keywords = ["legacy", "aftercare", "agent", "multi-agent", "mcp", "langgraph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # MCP 协议
    "mcp>=0.9.0",
    "fastmcp>=0.1.0",
    # LangGraph 编排
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    # 可观测性
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    # 知识图谱
    # lightrag 和 graphiti 按需安装，不强制
    # 评估
    "pyyaml>=6.0",
    "pydantic>=2.0",
    # 工具
    "httpx>=0.27.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
lightrag = ["lightrag-hku>=1.0"]
graphiti = ["graphiti-core>=0.5"]
langfuse = ["langfuse>=2.0"]
all = [
    "legacy-aftercare[dev,lightrag,graphiti,langfuse]",
]

[project.scripts]
legacy = "legacy.cli:main"
legacy-mcp-server = "legacy.mcp_server.server:main"

[tool.setuptools.packages.find]
where = [".traecli/src"]
include = ["legacy*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
