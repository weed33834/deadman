[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deadman"
version = "5.1.0"
description = "deadman - 身后事多智能体引导平台（不绑定任何厂商，适用于所有支持 agent 的平台）"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "deadman Team"}]
keywords = ["deadman", "aftercare", "agent", "multi-agent", "mcp", "langgraph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Topic :: Other/Nonlisted Topic",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # MCP 协议（fastmcp>=3.0 用于 @mcp.tool_auto 自动 schema 生成，v5.1 P8 引入）
    "mcp>=1.0",
    "fastmcp>=3.0",
    # LangGraph 编排
    "langgraph>=1.0",
    "langchain-core>=1.0",
    # 可观测性
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp>=1.30",
    # 知识图谱
    # lightrag 和 graphiti 按需安装，不强制
    # 评估
    "pyyaml>=6.0",
    "pydantic>=2.5",
    # LLM 官方 SDK（多厂商统一封装 + fallback）
    "openai>=1.50",
    "anthropic>=0.50",
    # 工具
    "httpx>=0.28",
    "tenacity>=9.0",
    # HTML 解析（替代 web_search 中手写正则解析）
    "beautifulsoup4>=4.12",
    # JWT 会话管理（替代手写 HMAC 实现）
    "PyJWT>=2.8",
    # Cron 表达式解析（替代手写 5 字段解析器）
    "croniter>=2.0",
    # AES-CBC 加密（WeChat 消息加密 / ending_note 生产级加密）
    "cryptography>=41.0",
    # 异步邮件发送（Dead Man Switch 状态变更通知律师/继承人）
    "aiosmtplib>=3.0",
    # Web 框架（FastAPI + uvicorn，替代 stdlib http.server）
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.5",
    # Prometheus 指标（HTTP RED 指标：请求计数/延迟直方图，官方客户端）
    "prometheus_client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "ruff>=0.15",
]
lightrag = ["lightrag-hku>=1.0"]
graphiti = ["graphiti-core>=0.5"]
langfuse = ["langfuse>=4.0"]
sqlite-checkpoint = ["langgraph-checkpoint-sqlite>=3.0"]
mcp = ["fastmcp>=3.0", "duckduckgo-search>=8.0"]
ragas = ["ragas>=0.2,<1.0", "datasets>=2.0", "langchain-community<0.4"]
# P1-2: Sentry 错误监控（sentry-sdk[fastapi] 含 ASGI auto-instrumentation）
sentry = ["sentry-sdk[fastapi]>=2.0"]
all = [
    "deadman[dev,lightrag,graphiti,langfuse,sqlite-checkpoint,mcp,ragas,sentry]",
]

[project.scripts]
deadman = "deadman.cli:main"
deadman-mcp-server = "deadman.mcp_server.server:main"
deadman-a2a-server = "deadman.a2a.server:main"
deadman-web-server = "deadman.web.app:main"
deadman-web-server-legacy = "deadman.web.server:main"

[tool.setuptools.packages.find]
where = [".traecli/src"]
include = ["deadman*"]

[tool.setuptools.package-data]
deadman = ["web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 显式声明启用规则集，避免依赖 ruff 默认配置漂移
# E  pycodestyle errors / W warnings
# F  pyflakes (undefined name / unused import / unused var)
# I  isort (import 顺序)
# B  bugbear (correctness / 常见 bug 模式)
# C4 comprehensions (列表/字典/集合推导简化)
# UP pyupgrade (语法现代化, 跟进 py310+)
# SIM simplify (代码简化)
# RUF ruff 专有规则
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
# 中文项目大量使用全角标点（，。：；！？"''）作为注释/字符串中的正常字符，
# RUF001/002/003 会把每一个全角字符都标为 ambiguous-unicode-character，
# 产生大量噪声告警（本项目 13000+ 处），无实际收益，整体忽略。
ignore = [
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
    # RUF022 unsorted-dunder-all：项目 __all__ 惯例按子模块分组排列（带注释），
    # 字母序排序会破坏分组可读性，整体忽略。
    "RUF022",
    # RUF012 mutable-class-default：项目类常量（FABRICATION_PATTERNS /
    # CRISIS_KEYWORDS / VOTER_WEIGHTS / FORBIDDEN_WORDS 等）按 UPPER_SNAKE_CASE
    # 命名约定表达"只读常量"意图，运行时不修改；统一改 ClassVar 需 16+ 处改动
    # 且引入额外 import，收益微小，整体忽略。
    "RUF012",
    # SIM102 collapsible-if：剩余 17 处均为 if 块内含多行 body 或注释的有意嵌套
    # （ruff 自动 fix 因副作用风险不覆盖），强行合并降低可读性，整体忽略。
    "SIM102",
    # E501 line-too-long 由 line-length=100 控制，长字符串/URL 单独豁免
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# 测试文件允许宽松一些
".traecli/src/tests/*" = ["E501"]
# multimodal 模块：asr/tts/vision/ocr/image_gen 大量使用
#   try: import openai / pywhispercpp / diffusers / azure.cognitiveservices.speech ...
# 模式探测可选依赖是否安装，import 本身即为副作用，变量未在文件内引用是预期行为。
".traecli/src/deadman/multimodal/*" = ["F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [".traecli/src/tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"'). Used for RAGAS / red-team / integration tests that burn tokens.",
    "ragas: marks tests that require ragas package installed.",
    "integration: marks tests that require external services (LLM API / Neo4j / Chroma).",
]
