# ============================================================
# deadman 平台 Docker Compose 编排
#
# 服务拓扑：
#   deadman          主服务（MCP Server HTTP，构建自 Dockerfile）
#   neo4j           Graphiti 时态记忆后端（可选 profile: graphiti）
#   langfuse        LLM 可观测性平台（可选 profile: observability）
#   langfuse-db     Langfuse 依赖的 Postgres（可选 profile: observability）
#   otel-collector  OpenTelemetry 中转（可选 profile: observability）
#   prometheus      指标采集 + 告警评估（可选 profile: observability）
#   alertmanager    告警分组/通知（可选 profile: observability）
#   grafana         指标可视化面板（可选 profile: observability，端口 3001）
#
# 用法：
#   # 仅启动主服务（默认）
#   docker compose up -d
#
#   # 主服务 + Neo4j（启用 Graphiti 时态记忆）
#   docker compose --profile graphiti up -d
#
#   # 主服务 + 可观测性栈（Langfuse + OTel Collector）
#   docker compose --profile observability up -d
#
#   # 全量启动（等价于同时激活 graphiti + observability）
#   docker compose --profile full up -d
#   # 或显式指定两个 profile：
#   docker compose --profile graphiti --profile observability up -d
#
# 配置：复制 .env.example 为 .env 并填入 LLM_API_KEY 等敏感配置
# ============================================================

services:
  # ============================================================
  # 主服务：deadman MCP Server
  # ============================================================
  deadman:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEADMAN_VERSION: ${DEADMAN_VERSION:-5.1}
    image: deadman:${DEADMAN_VERSION:-5.1}
    container_name: deadman
    restart: unless-stopped
    ports:
      - "${MCP_HOST_PORT:-8000}:8000"   # MCP Server
      - "${A2A_HOST_PORT:-8001}:8001"   # A2A Server
      - "${WEB_HOST_PORT:-8002}:8002"   # Web UI（AG-UI）
    environment:
      # === LLM 配置 ===
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}
      # === MCP Server ===
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: 8000
      # === Web UI ===
      WEB_SERVER_PORT: 8002
      # === 可观测性 ===
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4317}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      # === Graphiti / Neo4j（profile=graphiti 时生效）===
      GRAPHITI_ENABLED: ${GRAPHITI_ENABLED:-false}
      GRAPHITI_NEO4J_URI: ${GRAPHITI_NEO4J_URI:-bolt://neo4j:7687}
      GRAPHITI_NEO4J_USER: ${GRAPHITI_NEO4J_USER:-neo4j}
      GRAPHITI_NEO4J_PASSWORD: ${GRAPHITI_NEO4J_PASSWORD:-${NEO4J_PASSWORD:-changeme}}
      # === LightRAG ===
      LIGHTRAG_ENABLED: ${LIGHTRAG_ENABLED:-false}
      # === Reflexion / SelfCheck ===
      REFLEXION_MAX_RETRIES: ${REFLEXION_MAX_RETRIES:-3}
      SELFCHECK_CONSISTENCY_THRESHOLD: ${SELFCHECK_CONSISTENCY_THRESHOLD:-0.5}
      # === 日志与严格校验 ===
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STRICT_ENV_CHECK: ${STRICT_ENV_CHECK:-false}
      # === 主数据库（企业级扩展④，profile=db 时生效；留空则纯文件存储）===
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
    volumes:
      # 数据持久化（记忆 / LightRAG 存储 / 运行时数据）
      - ./data:/app/data
      # 可选：挂载测试套件以支持 eval 模式（.dockerignore 排除了 tests/）
      # - ./.traecli/tests:/app/.traecli/tests:ro
    networks:
      - deadman-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # 可选依赖：仅在对应 profile 启用时等待，否则跳过（required: false）
    # 需要 Docker Compose v2.20+ 支持 required 字段
    # deadman 服务无 profiles 声明 → 默认始终启动；
    # neo4j/langfuse/otel 仅在对应 profile 激活时启动
    depends_on:
      otel-collector:
        condition: service_started
        required: false
      neo4j:
        condition: service_healthy
        required: false
      deadman-db:
        condition: service_healthy
        required: false

  # ============================================================
  # Neo4j：Graphiti 时态记忆后端
  # 启用：docker compose --profile graphiti up -d
  # ============================================================
  neo4j:
    image: neo4j:5
    container_name: deadman-neo4j
    restart: unless-stopped
    profiles:
      - graphiti
      - full
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    ports:
      - "7474:7474"  # Neo4j Browser
      - "7687:7687"  # Bolt 协议
    networks:
      - deadman-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ============================================================
  # OpenTelemetry Collector：遥测数据中转
  # 启用：docker compose --profile observability up -d
  # 接收 OTLP（gRPC 4317 / HTTP 4318），转发至 debug 与 deadman 服务
  # ============================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: deadman-otel
    restart: unless-stopped
    profiles:
      - observability
      - full
    # 配置通过环境变量 OTEL_CONFIG 内联注入（--config=env:OTEL_CONFIG）
    # 避免额外挂载配置文件，保持部署自包含
    environment:
      OTEL_CONFIG: |
        extensions:
          health_check:
            endpoint: 0.0.0.0:13133
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
              http:
                endpoint: 0.0.0.0:4318
        processors:
          batch:
            timeout: 5s
            send_batch_size: 512
          memory_limiter:
            check_interval: 2s
            limit_percentage: 80
            spike_limit_percentage: 25
        exporters:
          debug:
            verbosity: basic
          # 如需导出到 Langfuse 或其他后端，在此扩展
        service:
          extensions: [health_check]
          telemetry:
            logs:
              level: info
          pipelines:
            traces:
              receivers: [otlp]
              processors: [memory_limiter, batch]
              exporters: [debug]
            metrics:
              receivers: [otlp]
              processors: [memory_limiter, batch]
              exporters: [debug]
            logs:
              receivers: [otlp]
              processors: [memory_limiter, batch]
              exporters: [debug]
    command: ["--config=env:OTEL_CONFIG"]
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
      - "8888:8888"  # 内部指标
      - "13133:13133"  # health_check 扩展端点
    networks:
      - deadman-net
    # 注意：otel-collector-contrib 镜像为 distroless（无 shell/wget/curl）
    # 无法使用 CMD-SHELL 健康检查。health_check 扩展已暴露 13133 端口，
    # 如需 Docker 级健康检查，可改用含 curl 的 sidecar 或使用 service_started 依赖。
    # 此处保留端口映射供外部探测：
    #   curl http://localhost:13133/ → 200 表示健康

  # ============================================================
  # Langfuse：LLM 可观测性平台
  # 启用：docker compose --profile observability up -d
  # 依赖 langfuse-db（Postgres）
  # ============================================================
  langfuse:
    image: langfuse/langfuse:latest
    container_name: deadman-langfuse
    restart: unless-stopped
    profiles:
      - observability
      - full
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:-langfuse}@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-changeme-please-32-chars-min}
      SALT: ${LANGFUSE_SALT:-changeme-please-32-chars-min}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      # Langfuse 自身的 OTel 导出（可选）
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    ports:
      - "3000:3000"  # Langfuse Web UI
    networks:
      - deadman-net
    depends_on:
      langfuse-db:
        condition: service_healthy
      otel-collector:
        condition: service_started
        required: false  # OTel 中转可选，缺失时 Langfuse 仍可运行（仅不导出 trace）
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/public/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  # ============================================================
  # Langfuse 依赖的 Postgres 数据库
  # ============================================================
  langfuse-db:
    image: postgres:16-alpine
    container_name: deadman-langfuse-db
    restart: unless-stopped
    profiles:
      - observability
      - full
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-langfuse}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    networks:
      - deadman-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  # ============================================================
  # Prometheus：指标采集与告警评估
  # 启用：docker compose --profile observability up -d
  # 抓取 deadman /metrics（HTTP RED 指标）+ OTel Collector 自身指标
  # 告警规则见 .traecli/docker/observability/alert_rules.yml
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: deadman-prometheus
    restart: unless-stopped
    profiles:
      - observability
      - full
    volumes:
      - ./.traecli/docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./.traecli/docker/observability/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - deadman-net

  # ============================================================
  # Alertmanager：告警分组/抑制/通知
  # 接收 Prometheus 告警，按路由推送到 webhook（飞书/钉钉，生产替换 URL）
  # ============================================================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: deadman-alertmanager
    restart: unless-stopped
    profiles:
      - observability
      - full
    volumes:
      - ./.traecli/docker/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093"
    networks:
      - deadman-net

  # ============================================================
  # Grafana：指标可视化面板
  # 启动时自动 provisioning Prometheus 数据源（见 grafana-datasource.yml）
  # 首次登录 admin / admin（生产改 GF_SECURITY_ADMIN_PASSWORD）
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: deadman-grafana
    restart: unless-stopped
    profiles:
      - observability
      - full
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./.traecli/docker/observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"  # 避让 Langfuse(3000)，主机用 3001
    networks:
      - deadman-net
    depends_on:
      prometheus:
        condition: service_started

# ============================================================
# 主数据库：PostgreSQL（企业级扩展④）
# 启用：docker compose --profile db up -d
# 配置 DATABASE_URL 后 deadman 服务自动双写 DB + 文件存储
# ============================================================
  deadman-db:
    image: postgres:16-alpine
    container_name: deadman-db
    restart: unless-stopped
    profiles:
      - db
      - full
    environment:
      POSTGRES_USER: ${DEADMAN_DB_USER:-deadman}
      POSTGRES_PASSWORD: ${DEADMAN_DB_PASSWORD:-deadman}
      POSTGRES_DB: ${DEADMAN_DB_NAME:-deadman}
    volumes:
      - deadman-db-data:/var/lib/postgresql/data
    ports:
      - "${DEADMAN_DB_HOST_PORT:-5432}:5432"
    networks:
      - deadman-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEADMAN_DB_USER:-deadman} -d ${DEADMAN_DB_NAME:-deadman}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

# ============================================================
# 卷定义
# ============================================================
volumes:
  neo4j-data:
    name: deadman-neo4j-data
  neo4j-logs:
    name: deadman-neo4j-logs
  langfuse-db-data:
    name: deadman-langfuse-db-data
  deadman-db-data:
    name: deadman-db-data
  prometheus-data:
    name: deadman-prometheus-data
  grafana-data:
    name: deadman-grafana-data

# ============================================================
# 网络隔离
# 使用专用 bridge 网络，与默认网络及其他 compose 项目隔离
# ============================================================
networks:
  deadman-net:
    driver: bridge
    name: deadman-net
    # 启用 IP 地址管理
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
