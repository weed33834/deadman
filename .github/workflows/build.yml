name: build

# CI/CD 供应链安全管线（企业级扩展①）
# - 构建：docker buildx 多阶段镜像构建
# - 扫描：Trivy 容器镜像漏洞扫描（HIGH/CRITICAL 阻断）
# - SBOM：syft 生成 CycloneDX 软件物料清单（供应链透明度）
# - 推送：仅 main 分支推 ghcr.io（PR 只构建验证不推送）
# 三件套复用现成 actions，不重复造轮子。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write  # 推送 ghcr.io 镜像

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta（自动生成 tag / label）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: ${{ github.event_name == 'pull_request' }}  # PR 仅加载到本地供扫描

      # 统一扫描引用：sha tag 在 PR(load 到本地) 与 main(push 到 ghcr) 两条路径下都存在
      # metadata-action type=sha,format=short 生成 sha-<7位>，与此一致
      - name: 计算扫描镜像引用
        id: scanref
        run: echo "image=ghcr.io/${{ github.repository }}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Trivy 漏洞扫描（HIGH/CRITICAL 阻断）
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.scanref.outputs.image }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: 生成 SBOM（CycloneDX）
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.scanref.outputs.image }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: 上传 SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30
