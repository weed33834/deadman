# 同步到 GitCode 流水线 - push 到 GitHub main 后自动镜像至 GitCode
# 目标仓库：gitcode.com/badhope/legacy-aftercare
name: 同步到 GitCode

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sync:
    name: 镜像同步至 GitCode
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（完整历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 同步至 GitCode（强推保持完全一致）
        run: |
          # 配置 GitCode remote（token 走 secret，不硬编码）
          git remote add gitcode "https://x-access-token:${{ secrets.GITCODE_TOKEN }}@gitcode.com/badhope/legacy-aftercare.git"
          # 强推 main 分支，保持与 GitHub 完全一致
          git push --force gitcode main

      - name: 同步完成提示
        run: |
          echo "✅ 已同步至 GitCode: https://gitcode.com/badhope/legacy-aftercare"
