# 发布流水线 - 打 v* tag 时触发
# Job 1: 构建并推送 Docker 镜像至 ghcr.io
# Job 2: 创建 GitHub Release（自动生成 release notes）
name: 发布

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  # ===== Job 1: 构建并推送 Docker 镜像至 GHCR =====
  build-and-publish:
    name: 构建并推送 Docker 镜像
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 小写化仓库名（GHCR 要求镜像路径全小写）
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据（tag/label）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送镜像至 GHCR
        uses: docker/build-push-action@v6
        with:
          context: .traecli
          file: .traecli/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===== Job 2: 创建 GitHub Release =====
  create-github-release:
    name: 创建 GitHub Release
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（完整历史用于生成 release notes）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 创建 Release（自动生成 release notes）
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          # tag 名含 '-'（如 v1.0.0-rc.1）视为预发布
          prerelease: ${{ contains(github.ref_name, '-') }}
