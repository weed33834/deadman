# Alembic 配置 - 企业级扩展④ 数据库迁移
# 生产环境使用 `alembic upgrade head` 应用迁移，而非 init_db() 的 create_all

[alembic]
# 迁移脚本目录
script_location = migrations
# 模板文件
# file_template = %%(rev)s_%%(slug)s
# 时区
timezone = UTC

# 数据库 URL（优先从环境变量 DATABASE_URL 读取；此处的值仅作 fallback）
# 注意：Alembic 使用同步驱动，postgresql:// 而非 +asyncpg
# 实际运行时 migrations/env.py 会从 settings.database_url 动态构建
sqlalchemy.url =


[post_write_hooks]
# 可选：迁移生成后自动 ruff format
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
