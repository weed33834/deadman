<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>deadman 机构工作台</title>
<script>window.APP_TOKEN_KEY="org_token";</script>
<script src="/static/js/common.js"></script>
<style>
:root{
  --paper:#f7f5f0; --paper-warm:#f1ece4; --line:#e7e0d4; --ink:#26211c;
  --ink-soft:#4a4238;
  --accent:#9a5b3f; --accent-deep:#7c4630; --accent-soft:#c89a82;
  --gold:#b98d4f; --sage:#5e7d63; --sage-deep:#45614a; --warn:#b0893c; --bad:#b0553f;
  --sage-bg:#eef2ec; --warn-bg:#f6f0e2; --bad-bg:#f7eae6;
  --radius-s:10px; --radius-m:16px; --radius-pill:999px;
  --shadow-s:0 1px 2px rgba(38,33,28,.05);
  --shadow-m:0 2px 6px rgba(38,33,28,.04),0 18px 40px rgba(38,33,28,.08);
  --ring:0 0 0 3px rgba(154,91,63,.18);
  --ease:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:
  radial-gradient(1200px 600px at 85% -10%, rgba(184,141,79,.10), transparent 60%),
  radial-gradient(900px 500px at -10% 110%, rgba(94,125,99,.08), transparent 55%),
  var(--paper);color:var(--ink);font-size:14px;min-height:100vh}
a{color:var(--accent);text-decoration:none}
h1,h2,.serif{font-family:"Noto Serif SC","Songti SC","STSong",serif}

/* ============ 顶栏 ============ */
.topbar{height:62px;display:flex;align-items:center;padding:0 24px;background:
  linear-gradient(90deg,#211d18,#2c251e);color:#f4eee2;gap:14px;position:sticky;top:0;z-index:20;
  box-shadow:0 1px 0 rgba(255,255,255,.04),0 10px 30px rgba(20,16,12,.25)}
.topbar .brand{display:flex;align-items:center;gap:10px}
.topbar .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--gold),var(--accent));
  display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;box-shadow:0 2px 8px rgba(185,141,79,.35)}
.topbar h1{font-size:16px;letter-spacing:2px;font-weight:600}
.topbar .orgname{font-size:12px;color:var(--accent-soft);letter-spacing:.5px}
.topbar .spacer{flex:1}
.topbar .who{display:flex;align-items:center;gap:8px;font-size:13px}
.topbar .who .role{font-size:11px;background:rgba(154,91,63,.35);color:#f2d9c8;padding:3px 10px;border-radius:var(--radius-pill)}
.topbar a.ret{font-size:12px;color:var(--accent-soft);padding:6px 12px;border:1px solid rgba(200,154,130,.5);border-radius:var(--radius-s);transition:all .2s var(--ease)}
.topbar a.ret:hover{background:rgba(200,154,130,.12)}

/* ============ 布局 ============ */
.wrap{display:flex;min-height:calc(100vh - 62px)}
.side{width:208px;padding:20px 14px;flex-shrink:0;border-right:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.12))}
.side .g{font-size:11px;color:var(--gold);letter-spacing:3px;padding:16px 10px 6px;font-weight:600;opacity:.85}
.side .item{display:flex;align-items:center;gap:11px;padding:10px 13px;cursor:pointer;font-size:13.5px;
  border-radius:var(--radius-s);color:var(--ink-soft);margin-bottom:3px;transition:all .2s var(--ease);
  border:1px solid transparent}
.side .item .ic{width:18px;text-align:center;font-size:15px;opacity:.8}
.side .item:hover{background:#fff;box-shadow:var(--shadow-s);color:var(--ink)}
.side .item.active{background:linear-gradient(120deg,#fff,#faf5ee);border-color:var(--line);
  color:var(--accent-deep);font-weight:600;box-shadow:var(--shadow-s)}
.side .item.active .ic{opacity:1}
.side .foot{margin-top:26px;padding:14px;border-radius:var(--radius-m);border:1px dashed var(--line);
  font-size:11px;color:var(--muted,#9a9183);line-height:1.7;text-align:center}
.side .foot .dot{color:var(--sage);font-weight:700}
.main{flex:1;padding:26px 30px 60px;overflow:auto;min-width:0}

/* ============ 卡片 ============ */
.page-head{margin-bottom:20px}
.page-head .kicker{font-size:11px;letter-spacing:4px;color:var(--gold);font-weight:600}
.page-head h2{font-size:24px;margin-top:4px;letter-spacing:1px}
.page-head .sub{font-size:12.5px;color:var(--muted,#9a9183);margin-top:6px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-m);padding:20px;margin-bottom:18px;
  box-shadow:var(--shadow-s)}
.card h3{font-size:14px;margin-bottom:14px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.card h3 .tag{font-size:11px;background:var(--accent);color:#fff;padding:2px 10px;border-radius:var(--radius-pill);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.stat{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:var(--radius-m);
  padding:16px 18px;box-shadow:var(--shadow-s);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-m)}
.stat::after{content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--gold),var(--accent-soft));opacity:.55}
.stat .k{font-size:12px;color:var(--muted,#9a9183)}
.stat .v{font-size:28px;font-weight:700;margin-top:6px;letter-spacing:.5px;font-family:"Noto Serif SC","Songti SC",serif}
.stat .d{font-size:11.5px;color:var(--sage-deep);margin-top:5px}

/* ============ 表格 ============ */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--paper-warm);font-weight:600;color:var(--accent-deep);font-size:12px;letter-spacing:.5px}
tbody tr{transition:background .15s var(--ease)} tbody tr:hover{background:#faf6ef}
tbody tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:2px 11px;border-radius:var(--radius-pill);font-size:11px;letter-spacing:.3px}
.pill.ok{background:var(--sage-bg);color:var(--sage-deep)} .pill.off{background:var(--paper-warm);color:var(--muted,#9a9183)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.accent{background:rgba(154,91,63,.12);color:var(--accent-deep)}

/* ============ 按钮 ============ */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--accent);color:#fff;border:none;
  border-radius:var(--radius-s);cursor:pointer;font-size:13px;transition:all .2s var(--ease);font-family:inherit}
.btn:hover{background:var(--accent-deep);transform:translateY(-1px);box-shadow:0 6px 16px rgba(154,91,63,.25)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.ghost:hover{background:#faf6ef;box-shadow:none}
.btn.green{background:var(--sage)} .btn.green:hover{background:var(--sage-deep)}
.btn.red{background:var(--bad)} .btn.sm{padding:5px 11px;font-size:12px}
.btn.danger-ghost{background:transparent;color:var(--bad);border:1px solid #e2c9c0}
.btn.danger-ghost:hover{background:var(--bad-bg);box-shadow:none}
.btn-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}

/* ============ 表单 ============ */
input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{
  width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius-s);background:#fff;
  font-size:13px;font-family:inherit;outline:none;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:var(--ring)}
textarea{resize:vertical;min-height:90px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:500}
.row{display:flex;gap:12px} .row .field{flex:1}
.muted{color:var(--muted,#9a9183);font-size:12px}
.msg{padding:9px 14px;border-radius:var(--radius-s);margin:10px 0;font-size:13px}
.msg.ok{background:var(--sage-bg);color:var(--sage-deep)} .msg.err{background:var(--bad-bg);color:var(--bad)}
.msg.info{background:#eef0f5;color:#4a5568}

/* ============ 状态分布条 ============ */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-row .lbl{width:92px;font-size:12px;color:var(--ink-soft)}
.bar-row .track{flex:1;height:8px;background:var(--paper-warm);border-radius:4px;overflow:hidden}
.bar-row .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent-soft),var(--accent));
  transition:width .5s var(--ease);min-width:2px}
.bar-row .num{width:30px;text-align:right;font-size:12px;color:var(--ink-soft);font-weight:600}

/* ============ 客户/案件条目 ============ */
.row-list{display:flex;flex-direction:column;gap:10px}
.row-item{display:flex;align-items:center;gap:14px;padding:13px 16px;background:#fff;border:1px solid var(--line);
  border-radius:var(--radius-m);transition:all .2s var(--ease)}
.row-item:hover{box-shadow:var(--shadow-s);border-color:#ddd2c2}
.row-item .avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent-soft),var(--accent));color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600}
.row-item .body{flex:1;min-width:0}
.row-item .title{font-size:14px;font-weight:600}
.row-item .meta{font-size:11.5px;color:var(--muted,#9a9183);margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}

/* ============ 模态 ============ */
.modal-bg{position:fixed;inset:0;background:rgba(32,28,23,.45);backdrop-filter:blur(3px);
  display:none;align-items:flex-start;justify-content:center;z-index:50;padding:8vh 16px;overflow:auto}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:var(--radius-m);padding:26px;width:100%;max-width:520px;
  box-shadow:0 30px 80px rgba(20,16,12,.35);animation:pop .25s var(--ease)}
.modal h3{font-size:17px;margin-bottom:18px;letter-spacing:1px}
.modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

/* ============ 登录 ============ */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(900px 500px at 80% 10%, rgba(185,141,79,.12), transparent 60%),
             radial-gradient(700px 500px at 10% 90%, rgba(94,125,99,.10), transparent 55%),var(--paper)}
.login-card{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:20px;
  padding:40px 38px;box-shadow:var(--shadow-m)}
.login-card .logo{width:56px;height:56px;border-radius:16px;margin:0 auto 20px;
  background:linear-gradient(135deg,var(--gold),var(--accent));display:flex;align-items:center;justify-content:center;
  font-size:26px;color:#fff;box-shadow:0 10px 30px rgba(154,91,63,.3)}
.login-card h1{text-align:center;font-size:22px;letter-spacing:3px}
.login-card .sub{text-align:center;font-size:12.5px;color:var(--muted,#9a9183);margin:8px 0 26px;line-height:1.7}
.login-card .btn{width:100%;justify-content:center;margin-top:8px;padding:11px}
.login-card .hint{margin-top:16px;font-size:11.5px;color:var(--muted,#9a9183);text-align:center;line-height:1.8}

/* ============ 空态 ============ */
.empty{padding:44px 20px;text-align:center;color:var(--muted,#9a9183);font-size:13px}
.empty .ic{font-size:34px;display:block;margin-bottom:10px;opacity:.55}

@media(max-width:860px){
  .side{width:64px;padding:20px 8px}.side .g,.side .item span,.side .foot{display:none}
  .side .item{justify-content:center;padding:12px}.side .item .ic{margin:0}
  .main{padding:20px 16px 50px}
}
</style>
</head>
<body>

<!-- ============ 登录视图 ============ -->
<div class="login-wrap" id="loginView" style="display:none">
  <div class="login-card">
    <div class="logo">枯</div>
    <h1>机构工作台</h1>
    <div class="sub">身后事多智能体引导平台 · 业务办案工作台<br>请使用机构成员账号登录</div>
    <div id="loginMsg"></div>
    <div class="field"><label>邮箱</label><input type="email" id="loginEmail" placeholder="your@email.com"></div>
    <div class="field"><label>密码</label><input type="password" id="loginPassword" placeholder="密码" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn" onclick="doLogin()">登录</button>
    <div class="hint">已绑定唯一机构的账号将自动进入工作台；<br>多机构账号登录后需选择机构。</div>
  </div>
</div>

<!-- ============ 机构选择视图 ============ -->
<div class="login-wrap" id="pickView" style="display:none">
  <div class="login-card">
    <div class="logo">枯</div>
    <h1>选择机构</h1>
    <div class="sub">您的账号关联了多个机构，请选择要进入的工作台</div>
    <div id="orgList"></div>
  </div>
</div>

<!-- ============ 工作台视图 ============ -->
<div id="workView" style="display:none">
  <div class="topbar">
    <div class="brand">
      <div class="logo">枯</div>
      <div>
        <h1>机构工作台</h1>
        <div class="orgname" id="orgName">—</div>
      </div>
    </div>
    <span class="spacer"></span>
    <div class="who">
      <span id="whoAmI">—</span>
      <span class="role" id="rolePill">viewer</span>
      <a class="ret" href="javascript:;" onclick="logout()">退出</a>
    </div>
  </div>
  <div class="wrap">
    <div class="side" id="side"></div>
    <div class="main" id="main"></div>
  </div>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>

<script>
const PANELS=[
 {id:"dashboard",label:"仪表盘",g:"工作台",icon:"◈"},
 {id:"customers",label:"客户",g:"工作台",icon:"☗"},
 {id:"cases",label:"案件",g:"工作台",icon:"◉"},
 {id:"kb",label:"知识库",g:"工作台",icon:"✎"},
 {id:"members",label:"成员",g:"团队",icon:"♢"},
 {id:"audit",label:"审计",g:"团队",icon:"▤"},
 {id:"settings",label:"设置",g:"团队",icon:"⚑"},
];
let current="dashboard";
const TOKEN_KEY=window.APP_TOKEN_KEY;  // 与 common.js 会话键一致
const ROLES={viewer:"查看者",consultant:"顾问",case_manager:"办案员",org_admin:"管理员"};

// el / token / api / esc / fmtDate 已由 /static/js/common.js 提供，此处不再重复定义
function msg(id,t,type){const m=el(id);if(!m)return;m.className="msg "+type;m.innerHTML=t}
function statusPill(s){const m={created:["created","待受理","warn"],assigned:["assigned","已分配","accent"],in_progress:["in_progress","进行中","ok"],pending_input:["pending_input","待补充","warn"],closed:["closed","已归档","off"],cancelled:["cancelled","已取消","off"]};
  const x=m[s]||[s,s,"off"];return `<span class="pill ${x[2]}">${x[1]}</span>`}
function roleName(r){return ROLES[r]||r}
const CASE_TYPES={funeral:"治丧",estate:"遗产继承",insurance:"保险理赔",notarization:"公证",other:"其他"};
const PRIORITIES={low:"低",normal:"普通",high:"高",urgent:"紧急"};
const STAGES={planning:"规划中",funeral:"治丧中",settlement:"善后办理",done:"已办结"};
const caseTypeName=c=>CASE_TYPES[c]||c||"-";
const priorityName=p=>PRIORITIES[p]||p||"-";
const stageName=s=>STAGES[s]||s||"-";

/* ============ 启动 ============ */
async function init(){
  if(!token()){showLogin();return}
  const invite = new URLSearchParams(location.search).get("invite");
  if(invite){
    const ar=await api("/api/orgs/invites/accept",{method:"POST",body:JSON.stringify({token:invite})});
    if(ar.ok){
      history.replaceState({},"",location.pathname);
      const sw=await api("/api/orgs/switch",{method:"POST",body:JSON.stringify({org_id:ar.data.org_id})});
      if(sw.ok) localStorage.setItem(TOKEN_KEY,sw.data.token);
    }
  }
  const r=await api("/api/orgs/me");
  if(r.ok && r.data && r.data.tenant_id){showWork(r.data);return}
  const ms=await api("/api/orgs/memberships");
  if(ms.ok && ms.data && ms.data.count>0) showPick(ms.data.memberships);
  else showLogin();
}
function showLogin(){el("loginView").style.display="";el("pickView").style.display="none";el("workView").style.display="none"}
function showPick(memberships){
  el("loginView").style.display="none";el("workView").style.display="none";
  el("pickView").style.display="";
  el("orgList").innerHTML=`<div class="row-list">${memberships.map(m=>`
    <div class="row-item" style="cursor:pointer" onclick="pickOrg('${esc(m.org_id)}')">
      <div class="avatar" style="background:linear-gradient(135deg,var(--sage),var(--sage-deep))">${esc((m.org_name||"机").slice(0,1))}</div>
      <div class="body">
        <div class="title">${esc(m.org_name||"未命名机构")}</div>
        <div class="meta"><span class="pill accent">${roleName(m.org_role)}</span></div>
      </div>
    </div>`).join("")}</div>`;
}
async function pickOrg(orgId){
  const r=await api("/api/orgs/switch",{method:"POST",body:JSON.stringify({org_id:orgId})});
  if(!r.ok){el("orgList").innerHTML=`<div class="msg err">${esc((r.data&&r.data.detail)||"切换失败")}</div>`;return}
  localStorage.setItem(TOKEN_KEY,r.data.token);
  await init();
}
async function doLogin(){
  const email=el("loginEmail").value.trim(),password=el("loginPassword").value;
  if(!email||!password){msg("loginMsg","请输入邮箱与密码","err");return}
  const r=await api("/api/auth/login",{method:"POST",body:JSON.stringify({email,password})});
  if(!r.ok){msg("loginMsg",esc((r.data&&r.data.detail)||"登录失败"),"err");return}
  localStorage.setItem(TOKEN_KEY,r.data.token);
  await init();
}
function logout(){localStorage.removeItem(TOKEN_KEY);showLogin()}
function showWork(ctx){
  el("loginView").style.display="none";el("pickView").style.display="none";el("workView").style.display="";
  el("orgName").textContent=(ctx.org&&ctx.org.name)||"我的机构";
  el("rolePill").textContent=roleName(ctx.org_role);
  el("whoAmI").textContent=ctx.display_name||ctx.user_id||"";
  renderSide();renderPanel();
}
function renderSide(){let last="";el("side").innerHTML=PANELS.map(p=>{
  let h=p.g!==last?`<div class="g">${p.g}</div>`:"";last=p.g;
  return h+`<div class="item ${p.id===current?"active":""}" onclick="go('${p.id}')"><span class="ic">${p.icon}</span><span>${p.label}</span></div>`}).join("")+
  `<div class="foot">本系统为身后事业务提供<b>严谨、庄重、有温度</b>的服务支持。</div>`}
function go(id){current=id;renderSide();renderPanel()}
function card(t,b){return `<div class="card"><h3>${t}</h3>${b}</div>`}
function stat(k,v,d){return `<div class="stat"><div class="k">${k}</div><div class="v">${v??"-"}</div>${d?`<div class="d">${d}</div>`:""}</div>`}
function empty(ic,t){return `<div class="empty"><span class="ic">${ic}</span>${t}</div>`}

async function renderPanel(){
  const fns={dashboard:renderDashboard,customers:renderCustomers,cases:renderCases,kb:renderKb,members:renderMembers,audit:renderAudit,settings:renderSettings};
  try{await fns[current]()}catch(e){el("main").innerHTML=card("出错了",`<div class="msg err">${esc(e.message||e)}</div>`)}
}

/* ============ 仪表盘 ============ */
async function renderDashboard(){
  const d=(await api("/api/org/dashboard")).data||{};
  const sb=d.status_breakdown||{};
  const order=["created","assigned","in_progress","pending_input","closed","cancelled"];
  const labels={created:"待受理",assigned:"已分配",in_progress:"进行中",pending_input:"待补充",closed:"已归档",cancelled:"已取消"};
  const maxV=Math.max(1,...Object.values(sb));
  const bars=order.filter(s=>sb[s]!=null).map(s=>`
    <div class="bar-row"><span class="lbl">${labels[s]||s}</span>
    <div class="track"><div class="fill" style="width:${(sb[s]/maxV*100).toFixed(1)}%"></div></div>
    <span class="num">${sb[s]}</span></div>`).join("")||empty("◍","暂无案件");
  el("main").innerHTML=`
   <div class="page-head"><div class="kicker">OVERVIEW</div><h2>仪表盘</h2>
   <div class="sub">今日概览 · 客户与案件进展一目了然</div></div>
   <div class="grid">
     ${stat("客户总数",d.customer_count??0,"建档客户")}

async function setStatus(caseId,s){

  msg("caMsg","状态已更新","ok");loadEvents(caseId);renderCases();
}
async function assignCase(caseId){
  const uid=el("assignee").value.trim();
  if(!uid){msg("caMsg","请填写负责人 user_id","err");return}
  const r=await api("/api/org/cases/"+caseId+"/assign",{method:"POST",body:JSON.stringify({assignee_user_id:uid})});
  if(!r.ok){msg("caMsg",esc((r.data&&r.data.detail)||"分配失败"),"err");return}
  msg("caMsg","已分配","ok");loadEvents(caseId);renderCases();
}
async function genMaterial(caseId){
  const name=el("genName").value.trim();
  if(!name){msg("caMsg","请填写逝者姓名","err");return}
  const gen=el("genType").value;
  const body=gen==="letter"?{generator:"letter",decedent_name:name,letter_type:"notice"}
                           :{generator:"memorial",doc_type:"eulogy",decedent_name:name};
  const r=await api("/api/org/cases/"+caseId+"/material",{method:"POST",body:JSON.stringify(body)});
  if(!r.ok){msg("caMsg",esc((r.data&&r.data.detail)||"生成失败"),"err");return}
  const m=(r.data.material||{});
  msg("caMsg",`已生成材料：<b>${esc(m.doc_type||"")}</b>（${(m.content||"").length} 字）`,"ok");
}

function openKbForm(docId){
  const isEdit=!!docId;
  el("modalBox").innerHTML=`<h3>${isEdit?"编辑":"新建"}机构知识</h3><div id="kbMsg"></div>
    <div class="field"><label>标题 *</label><input type="text" id="kbTitle" value="${isEdit?esc(docId):""}" placeholder="如 广东农村殡葬习俗SOP"></div>
    <div class="field"><label>分类</label><select id="kbCat">
      <option>民俗</option><option>SOP</option><option>价格</option><option>政策</option></select></div>
    <div class="field"><label>标签（逗号分隔）</label><input type="text" id="kbTags" placeholder="习俗, 广东"></div>
    <div class="field"><label>内容</label><textarea id="kbContent" placeholder="机构内部参考资料……"></textarea></div>
    <div class="actions">
      <button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn" onclick="saveKb(${isEdit?"`+JSON.stringify(docId)+`":"''"})">保存</button></div>`;
  openModal();
  if(isEdit) loadKbDoc(docId);
}
async function loadKbDoc(docId){
  const r=await api("/api/org/kb");
  const doc=(r.data&&r.data.private||[]).find(x=>x.id===docId);
  if(!doc)return;
  el("kbTitle").value=doc.title;el("kbCat").value=doc.category||"民俗";
  el("kbTags").value=(doc.tags||[]).join(", ");el("kbContent").value=doc.content||"";
}
async function saveKb(docId){
  const title=el("kbTitle").value.trim();
  if(!title){msg("kbMsg","请填写标题","err");return}
  const id=docId||encodeURIComponent(title);
  const r=await api("/api/org/kb/"+id,{method:"POST",body:JSON.stringify({
    title,category:el("kbCat").value,content:el("kbContent").value,
    tags:el("kbTags").value.split(/[,，]/).map(s=>s.trim()).filter(Boolean)})});
  if(!r.ok){msg("kbMsg",esc((r.data&&r.data.detail)||"保存失败"),"err");return}
  closeModal();renderKb();
}
async function delDoc(docId){
  if(!confirm("确定删除这篇机构知识？"))return
  const r=await api("/api/org/kb/"+docId,{method:"DELETE"});
  if(!r.ok){alert((r.data&&r.data.detail)||"删除失败");return}
  renderKb();
}
function viewDoc(docId){
  api("/api/org/kb").then(r=>{
    const doc=(r.data&&r.data.private||[]).find(x=>x.id===docId);
    el("modalBox").innerHTML=`<h3>${esc(doc?doc.title:docId)}</h3>
      <div class="muted" style="margin-bottom:12px">分类：${esc(doc?doc.category:"")} · 更新：${esc(doc?doc.updated_at:"")}</div>

    openModal();
  });
}

  closeModal();renderMembers();
}
async function removeMember(uid){
  if(!confirm("确定移除该成员？客户数据仍保留在机构。"))return
  const me=await api("/api/orgs/me");
  const orgId=(me.data&&me.data.tenant_id)||"";
  const r=await api("/api/orgs/"+orgId+"/members/"+uid,{method:"DELETE"});
  if(!r.ok){msg("maMsg",esc((r.data&&r.data.detail)||"移除失败"),"err");return}
  closeModal();renderMembers();
}

/* ============ 审计 ============ */
async function renderAudit(){
  const r=await api("/api/org/audit");
  if(r.status===403){el("main").innerHTML=card("审计",`<div class="msg info">${esc((r.data&&r.data.detail)||"仅机构管理员可查看审计")}</div>`);return}
  const rows=(r.data&&r.data.events)||[];
  el("main").innerHTML=`
   <div class="page-head"><div class="kicker">AUDIT</div><h2>审计</h2>
   <div class="sub">案件操作留痕，共 ${r.data&&r.data.count||rows.length} 条</div></div>
   ${rows.length?`<table><thead><tr><th>时间</th><th>操作</th><th>案件</th><th>操作人</th><th>详情</th></tr></thead>
   <tbody>${rows.map(e=>`<tr>
     <td class="muted">${esc((e.created_at||"").slice(0,19))}</td>
     <td><span class="pill accent">${esc(e.action||"")}</span></td>
     <td class="muted">${esc(e.case_type||"")} · ${esc((e.case_id||"").slice(0,8))}</td>
     <td class="muted">${esc(e.actor_user_id||"-")}</td>
     <td class="muted">${e.detail&&Object.keys(e.detail).length?esc(JSON.stringify(e.detail)):"-"}</td>
   </tr>`).join("")}</tbody></table>`:empty("▤","暂无审计事件")}`;
}

/* ============ 设置 ============ */
async function exportOrgData(){
  msg("setMsg","正在打包全量数据…","");
  const r=await api("/api/org/export",{method:"POST",body:"{}"});
  if(!r.ok){msg("setMsg",esc((r.data&&r.data.detail)||"导出失败"),"err");return}
  const job=r.data&&r.data.job_id;if(!job){msg("setMsg","导出任务未返回 job_id","err");return}
  const poll=async()=>{
    const s=await api("/api/org/export/status?job_id="+job);
    const b=s.data||{};
    if(b.status==="done"&&b.download_url){window.location=b.download_url;msg("setMsg","导出完成，正在下载…","ok");return}
    if(b.status==="error"){msg("setMsg",esc(b.error||"导出失败"),"err");return}
    msg("setMsg","打包中…（"+((b.progress!=null)?(b.progress+"%"):"进行中")+"）","");
    setTimeout(poll,1200);
  };
  poll();
}
async function exportAuditLogs(fmt){
  const r=await fetch("/api/org/audit-logs/export?format="+fmt,{headers:{Authorization:"Bearer "+token()}});
  if(!r.ok){let d=null;try{d=await r.json()}catch(e){}msg("setMsg",esc((d&&d.detail)||"导出失败"),"err");return}
  const blob=await r.blob();
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="audit_log."+(fmt==="csv"?"csv":"json");
  a.click();URL.revokeObjectURL(a.href);
  msg("setMsg","审计日志已导出（"+fmt.toUpperCase()+"）","ok");
}
async function renderSettings(){
  const me=await api("/api/orgs/me");
  const ctx=me.data||{};
  const org=ctx.org||{};
  el("main").innerHTML=`
   <div class="page-head"><div class="kicker">SETTINGS</div><h2>设置</h2></div>
   <div id="setMsg"></div>
   <div class="card"><h3>机构资料</h3>
     <table><tbody>
       <tr><th style="width:140px">机构名称</th><td>${esc(org.name||"未命名机构")}</td></tr>
       <tr><th>机构标识</th><td>${esc(org.slug||org.org_id||"-")}</td></tr>
       <tr><th>机构 ID</th><td class="mono">${esc(org.org_id||"-")}</td></tr>
       <tr><th>套餐</th><td><span class="pill accent">${esc(org.plan||"free")}</span></td></tr>
       <tr><th>状态</th><td>${org.status==="active"?`<span class="pill ok">正常</span>`:`<span class="pill bad">${esc(org.status||"-")}</span>`}</td></tr>
       <tr><th>我的角色</th><td><span class="pill accent">${roleName(ctx.org_role)}</span></td></tr>
       <tr><th>我的账号</th><td>${esc(ctx.user_id||"-")}</td></tr>
     </tbody></table></div>
   <div class="card"><h3>数据导出</h3><div class="muted" style="margin-bottom:12px">
     审计日志导出（CSV/JSON）与机构全量数据打包（zip），仅含本机构数据。</div>
     <div class="btn-row">
       <button class="btn sm" onclick="exportAuditLogs('csv')">导出审计日志 CSV</button>
       <button class="btn sm" onclick="exportAuditLogs('json')">导出审计日志 JSON</button>
       <button class="btn sm green" onclick="exportOrgData()">导出全量数据 zip</button>
     </div></div>`;
}

/* ============ 模态 ============ */
function openModal(){el("modalBg").classList.add("open")}
function closeModal(){el("modalBg").classList.remove("open")}

init();
