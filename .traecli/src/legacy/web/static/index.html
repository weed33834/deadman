<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>死者为大 — 身后事智能体平台</title>
<style>
  :root {
    --ink: #1a1a1a;
    --ink-soft: #4a4a4a;
    --ink-muted: #8a8a8a;
    --paper: #faf9f7;
    --paper-warm: #f4f1ec;
    --line: #e4e0d8;
    --line-soft: #efece5;
    --accent: #6b5d4f;
    --accent-deep: #4a3f35;
    --accent-soft: #a89888;
    --seal: #8b3a3a;
    --seal-soft: #c08585;
    --gold: #b8956a;
    --ok: #5a7a5a;
    --ok-bg: #eef2ee;
    --warn: #b8860b;
    --warn-bg: #f5f0e6;
    --err: #8b3a3a;
    --err-bg: #f5eaea;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background: var(--paper); color: var(--ink); height: 100vh; display: flex;
    font-size: 14px; line-height: 1.6;
  }
  /* ===== 侧边栏 ===== */
  .sidebar {
    width: 220px; background: var(--ink); color: var(--paper-warm);
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .sidebar-header {
    padding: 28px 24px 20px; border-bottom: 1px solid #2a2a2a;
  }
  .sidebar-title {
    font-family: "Songti SC", "STSong", "SimSun", serif;
    font-size: 20px; letter-spacing: 2px; font-weight: 400;
  }
  .sidebar-subtitle {
    font-size: 11px; color: var(--accent-soft); margin-top: 4px;
    letter-spacing: 1px;
  }
  .nav-list { flex: 1; padding: 16px 0; }
  .nav-item {
    padding: 11px 24px; cursor: pointer; transition: all 0.15s;
    font-size: 13px; color: var(--paper-warm);
    border-left: 2px solid transparent;
  }
  .nav-item:hover { background: #242424; color: #fff; }
  .nav-item.active {
    background: #242424; border-left-color: var(--gold); color: #fff;
  }
  .sidebar-footer {
    padding: 16px 24px; font-size: 10px; color: #5a5a5a;
    border-top: 1px solid #2a2a2a; letter-spacing: 0.5px;
  }
  /* ===== 主区域 ===== */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar {
    padding: 18px 32px; background: var(--paper);
    border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
    flex-shrink: 0;
  }
  .topbar-title {
    font-family: "Songti SC", "STSong", serif;
    font-size: 16px; font-weight: 500; color: var(--ink); letter-spacing: 1px;
  }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
    display: inline-block;
  }
  .status-dot.busy { background: var(--warn); animation: pulse 1.2s infinite; }
  .status-dot.err { background: var(--err); }
  @keyframes pulse { 50% { opacity: 0.4; } }
  .status-text { font-size: 12px; color: var(--ink-soft); }
  .content { flex: 1; overflow-y: auto; }

  /* ===== 对话页 ===== */
  #page-chat { display: flex; flex-direction: column; height: 100%; }
  .chat-area {
    flex: 1; overflow-y: auto; padding: 32px;
    background: var(--paper);
  }
  .message {
    max-width: 680px; margin: 0 auto 20px; display: flex; gap: 14px;
  }
  .message.user { flex-direction: row-reverse; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-family: "Songti SC", serif;
  }
  .avatar.user { background: var(--accent); color: var(--paper-warm); }
  .avatar.bot {
    background: var(--paper-warm); color: var(--accent-deep);
    border: 1px solid var(--line);
  }
  .bubble {
    max-width: 72%; padding: 12px 16px; border-radius: 4px;
    line-height: 1.7; font-size: 14px; white-space: pre-wrap; word-break: break-word;
  }
  .message.user .bubble {
    background: var(--accent); color: var(--paper-warm);
    border-radius: 4px 4px 0 4px;
  }
  .message.bot .bubble {
    background: #fff; color: var(--ink);
    border: 1px solid var(--line-soft); border-radius: 4px 4px 4px 0;
  }
  .meta { font-size: 10px; color: var(--ink-muted); margin-top: 5px; }
  .input-area {
    padding: 16px 32px; background: var(--paper);
    border-top: 1px solid var(--line);
  }
  .input-wrapper {
    max-width: 680px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
  }
  textarea {
    flex: 1; padding: 11px 14px; border: 1px solid var(--line);
    border-radius: 4px; background: #fff;
    font-size: 14px; font-family: inherit; resize: none; max-height: 120px;
    outline: none; transition: border-color 0.15s; line-height: 1.6;
  }
  textarea:focus { border-color: var(--accent-soft); }
  button {
    padding: 11px 22px; background: var(--accent); color: var(--paper-warm);
    border: none; border-radius: 4px; font-size: 13px; cursor: pointer;
    transition: background 0.15s; letter-spacing: 1px;
  }
  button:hover { background: var(--accent-deep); }
  button:disabled { background: var(--line); color: var(--ink-muted); cursor: not-allowed; }
  .typing-dot {
    display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--ink-muted); margin: 0 2px;
    animation: blink 1.4s infinite both;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }

  /* ===== 通用面板 ===== */
  .panel { padding: 28px 32px; max-width: 960px; margin: 0 auto; }
  .panel-section {
    background: #fff; border: 1px solid var(--line-soft);
    padding: 22px 24px; margin-bottom: 18px;
  }
  .section-title {
    font-family: "Songti SC", "STSong", serif;
    font-size: 15px; font-weight: 500; color: var(--accent-deep);
    margin-bottom: 4px; letter-spacing: 1px;
  }
  .section-desc {
    font-size: 11px; color: var(--ink-muted); margin-bottom: 16px;
  }
  /* ===== 表格 ===== */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; padding: 9px 12px; background: var(--paper-warm);
    font-weight: 500; color: var(--ink-soft);
    border-bottom: 1px solid var(--line); font-size: 12px;
  }
  td {
    padding: 9px 12px; border-bottom: 1px solid var(--line-soft);
    color: var(--ink);
  }
  tr:last-child td { border-bottom: none; }
  /* ===== 状态标签 ===== */
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: 2px;
    font-size: 11px; letter-spacing: 0.5px;
  }
  .tag.ok { background: var(--ok-bg); color: var(--ok); }
  .tag.fail { background: var(--err-bg); color: var(--err); }
  .tag.skip { background: var(--paper-warm); color: var(--ink-muted); }
  .tag.warn { background: var(--warn-bg); color: var(--warn); }
  /* ===== 测试中心 ===== */
  .test-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 14px;
  }
  .test-card {
    background: #fff; border: 1px solid var(--line-soft);
    padding: 16px; transition: border-color 0.15s;
  }
  .test-card:hover { border-color: var(--accent-soft); }
  .test-card-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 6px;
  }
  .test-card-name {
    font-family: "Songti SC", serif; font-size: 14px; font-weight: 500;
    color: var(--ink);
  }
  .test-card-domain { font-size: 10px; color: var(--ink-muted); letter-spacing: 0.5px; }
  .test-card-desc { font-size: 11px; color: var(--ink-muted); margin-bottom: 12px; line-height: 1.5; }
  .test-btn {
    padding: 6px 16px; font-size: 12px; background: var(--paper-warm);
    color: var(--accent-deep); border: 1px solid var(--line);
  }
  .test-btn:hover { background: var(--accent); color: var(--paper-warm); border-color: var(--accent); }
  .test-output {
    margin-top: 10px; padding: 12px; background: var(--ink); color: #d4d0c8;
    font-family: "SF Mono", "Menlo", monospace; font-size: 11px; line-height: 1.6;
    max-height: 280px; overflow-y: auto; white-space: pre-wrap; display: none;
  }
  .test-output.show { display: block; }
  .test-output.loading { color: var(--ink-muted); }
  /* ===== 看板指标 ===== */
  .stat-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
  }
  .stat-card {
    background: var(--paper); padding: 14px 16px; border: 1px solid var(--line-soft);
  }
  .stat-label { font-size: 11px; color: var(--ink-muted); margin-bottom: 6px; }
  .stat-value {
    font-family: "Songti SC", serif; font-size: 22px; font-weight: 500;
    color: var(--accent-deep);
  }
  /* ===== 领域健康 ===== */
  .domain-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }
  .domain-card {
    background: var(--paper); border: 1px solid var(--line-soft);
    padding: 14px; text-align: center;
  }
  .domain-name {
    font-family: "Songti SC", serif; font-size: 13px; font-weight: 500;
    color: var(--ink); margin-bottom: 8px;
  }
  select {
    padding: 5px 10px; border: 1px solid var(--line); border-radius: 3px;
    background: #fff; font-size: 12px; font-family: inherit; color: var(--ink);
    outline: none;
  }
  .hidden { display: none !important; }
  .empty-hint { text-align: center; padding: 40px; color: var(--ink-muted); font-size: 13px; }
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-title">死者为大</div>
    <div class="sidebar-subtitle">LEGACY · 終活</div>
  </div>
  <div class="nav-list">
    <div class="nav-item active" data-page="chat" onclick="switchPage('chat')">对话</div>
    <div class="nav-item" data-page="dashboard" onclick="switchPage('dashboard')">运维看板</div>
    <div class="nav-item" data-page="test" onclick="switchPage('test')">测试中心</div>
    <div class="nav-item" data-page="resources" onclick="switchPage('resources')">资源列表</div>
  </div>
  <div class="sidebar-footer">v5.0 · 三仓同步</div>
</div>

<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="pageTitle">对话</div>
    <div class="topbar-right">
      <select id="agentSelect" onchange="currentAgent=this.value"></select>
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">就绪</span>
    </div>
  </div>
  <div class="content">

    <!-- 对话 -->
    <div id="page-chat" class="page">
      <div class="chat-area" id="chatArea">
        <div class="message bot">
          <div class="avatar bot">引</div>
          <div>
            <div class="bubble">您好。在这个特殊的时刻，我会陪伴您一起处理逝者的身后事务。有什么需要了解的，请随时告诉我。</div>
            <div class="meta">身后事流程引导员</div>
          </div>
        </div>
      </div>
      <div class="input-area">
        <div class="input-wrapper">
          <textarea id="input" placeholder="请输入您的问题…" rows="1" onkeydown="handleKey(event)"></textarea>
          <button id="sendBtn" onclick="send()">发送</button>
        </div>
      </div>
    </div>

    <!-- 运维看板 -->
    <div id="page-dashboard" class="page hidden">
      <div class="panel">
        <div class="panel-section">
          <div class="section-title">领域健康</div>
          <div class="section-desc">各模块反馈闭环状态（data/*_health.json）</div>
          <div class="domain-grid" id="healthGrid"></div>
        </div>
        <div class="panel-section">
          <div class="section-title">记忆系统</div>
          <div class="section-desc">四层记忆当前条目数</div>
          <div class="stat-grid" id="memoryGrid"></div>
        </div>
        <div class="panel-section">
          <div class="section-title">部署工件</div>
          <table id="deployTable">
            <thead><tr><th>工件</th><th>状态</th><th>路径</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <button onclick="loadDashboard()">刷新</button>
      </div>
    </div>

    <!-- 测试中心 -->
    <div id="page-test" class="page hidden">
      <div class="panel">
        <div class="panel-section">
          <div class="section-title">分领域自测</div>
          <div class="section-desc">运行对应 CLI 命令，查看延迟与可用性反馈</div>
          <div class="test-grid" id="testGrid"></div>
        </div>
      </div>
    </div>

    <!-- 资源列表 -->
    <div id="page-resources" class="page hidden">
      <div class="panel">
        <div class="panel-section">
          <div class="section-title">智能体</div>
          <table id="agentsTable">
            <thead><tr><th>标识</th><th>名称</th></tr></thead><tbody></tbody>
          </table>
        </div>
        <div class="panel-section">
          <div class="section-title">MCP 工具</div>
          <table id="toolsTable">
            <thead><tr><th>工具</th><th>说明</th></tr></thead><tbody></tbody>
          </table>
        </div>
        <button onclick="loadResources()">刷新</button>
      </div>
    </div>

  </div>
</div>

<script>
const AGENTS = [
  { id: "death-aftercare", name: "身后事流程引导员" },
  { id: "legal-advisor", name: "法律咨询智能体" },
  { id: "financial-analyst", name: "财务分析智能体" },
  { id: "policy-researcher", name: "政策研究智能体" },
  { id: "cross-border-specialist", name: "跨境事务智能体" },
  { id: "medical-guide", name: "医疗导航智能体" },
];
let currentAgent = "death-aftercare";
let history = [];
let streaming = false;

const TEST_GROUPS = [
  { domain: "LLM", tests: [
    { cmd: "llm-test", name: "接入测试", desc: "各 provider 延迟与可用性" },
    { cmd: "llm-sync-models", name: "模型同步", desc: "从 /models 端点拉取清单" },
    { cmd: "llm-cost", name: "成本汇总", desc: "累计 token 消耗" },
  ]},
  { domain: "提示词", tests: [
    { cmd: "prompt-list", name: "本地清单", desc: ".prompty 文件列表" },
    { cmd: "prompt-sync", name: "远端同步", desc: "LangSmith / deepset 拉取" },
  ]},
  { domain: "规则", tests: [
    { cmd: "rule-test", name: "规则校验", desc: "编造检测与风险分级" },
    { cmd: "rule-validate", name: "完整性校验", desc: "引用文件与优先级链" },
  ]},
  { domain: "智能体", tests: [
    { cmd: "agent-list", name: "本地清单", desc: "agents/*.md 定义" },
  ]},
  { domain: "知识库", tests: [
    { cmd: "knowledge-list", name: "文件清单", desc: "regions/**/*.md" },
    { cmd: "knowledge-freshness", name: "新鲜度", desc: "90/180/365 天阈值" },
  ]},
  { domain: "MCP", tests: [
    { cmd: "tool-list", name: "工具清单", desc: "13 个内置工具" },
    { cmd: "mcp-ping", name: "可达性", desc: "外部 server 探测" },
  ]},
  { domain: "可观测", tests: [
    { cmd: "obs-dashboard", name: "指标看板", desc: "11 类指标汇总" },
    { cmd: "obs-test", name: "接入测试", desc: "span / 指标 / 后端" },
    { cmd: "obs-export", name: "Prometheus", desc: "文本格式导出" },
  ]},
  { domain: "记忆", tests: [
    { cmd: "memory-list", name: "分层状态", desc: "四层条目数" },
    { cmd: "memory-test", name: "读写测试", desc: "情景写入与召回" },
    { cmd: "memory-ping", name: "后端探测", desc: "Graphiti / LightRAG" },
  ]},
  { domain: "A2A", tests: [
    { cmd: "a2a-card", name: "AgentCard", desc: "本地名片完整性" },
    { cmd: "a2a-test", name: "协议自测", desc: "JSON-RPC tasks/send" },
    { cmd: "a2a-registry", name: "注册中心", desc: "线上 registry 可达性" },
  ]},
  { domain: "部署", tests: [
    { cmd: "deploy-check", name: "工件校验", desc: "Dockerfile / compose / entrypoint" },
    { cmd: "deploy-test", name: "运行时", desc: "docker 与 healthcheck" },
  ]},
  { domain: "反思", tests: [
    { cmd: "reflexion-list", name: "调整策略", desc: "10 种快速路径" },
    { cmd: "reflexion-test", name: "重试测试", desc: "mock 操作失败重试" },
    { cmd: "reflexion-ping", name: "反思路径", desc: "LLM 慢速路径可达" },
  ]},
  { domain: "技能", tests: [
    { cmd: "skill-list", name: "技能清单", desc: "skills/*/SKILL.md" },
    { cmd: "skill-validate", name: "完整性校验", desc: "frontmatter 字段" },
  ]},
];

function switchPage(page) {
  document.querySelectorAll(".page").forEach(p => p.classList.add("hidden"));
  document.getElementById("page-" + page).classList.remove("hidden");
  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
  document.querySelector(`.nav-item[data-page="${page}"]`).classList.add("active");
  const titles = { chat: "对话", dashboard: "运维看板", test: "测试中心", resources: "资源列表" };
  document.getElementById("pageTitle").textContent = titles[page] || page;
  if (page === "dashboard") loadDashboard();
  if (page === "test") renderTestGrid();
  if (page === "resources") loadResources();
}

const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const chatArea = document.getElementById("chatArea");
const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");

(function initAgentSelect() {
  const sel = document.getElementById("agentSelect");
  AGENTS.forEach(a => {
    const opt = document.createElement("option");
    opt.value = a.id; opt.textContent = a.name;
    sel.appendChild(opt);
  });
})();

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
}

function addMessage(role, text, meta) {
  const msg = document.createElement("div");
  msg.className = "message " + role;
  const avatar = document.createElement("div");
  avatar.className = "avatar " + role;
  avatar.textContent = role === "user" ? "我" : "引";
  const content = document.createElement("div");
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  content.appendChild(bubble);
  if (meta) {
    const m = document.createElement("div");
    m.className = "meta"; m.textContent = meta;
    content.appendChild(m);
  }
  msg.appendChild(avatar); msg.appendChild(content);
  chatArea.appendChild(msg);
  chatArea.scrollTop = chatArea.scrollHeight;
  return bubble;
}

async function send() {
  const text = input.value.trim();
  if (!text || streaming) return;
  input.value = ""; input.style.height = "auto";
  addMessage("user", text);
  history.push({ role: "user", content: text });
  streaming = true; sendBtn.disabled = true;
  statusDot.className = "status-dot busy";
  statusText.textContent = "响应中";
  const bubble = addMessage("bot", "");
  bubble.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
  let full = "";
  try {
    const url = `/api/stream?query=${encodeURIComponent(text)}&agent=${encodeURIComponent(currentAgent)}`;
    const resp = await fetch(url);
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop() || "";
      for (const line of lines) {
        if (line.startsWith("data: ")) {
          try {
            const d = JSON.parse(line.slice(6));
            if (d.chunk) { full += d.chunk; bubble.textContent = full; chatArea.scrollTop = chatArea.scrollHeight; }
          } catch (e) {}
        }
      }
    }
    if (!full) {
      const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ query: text, agent: currentAgent, history }) });
      const data = await r.json();
      full = data.response || "（无响应）";
    }
    bubble.textContent = full;
    history.push({ role: "assistant", content: full });
  } catch (e) {
    bubble.textContent = "请求失败：" + e.message;
  } finally {
    streaming = false; sendBtn.disabled = false;
    statusDot.className = "status-dot"; statusText.textContent = "就绪";
  }
}

async function loadDashboard() {
  try {
    const r = await fetch("/api/health/all");
    const data = await r.json();
    const grid = document.getElementById("healthGrid");
    grid.innerHTML = "";
    const names = { llm:"LLM", prompt:"提示词", rule:"规则", agent:"智能体", knowledge:"知识库", eval:"评估", tool:"MCP", mcp:"MCP", obs:"可观测", memory:"记忆", a2a:"A2A", deploy:"部署", reflexion:"反思", skill:"技能" };
    Object.entries(data).forEach(([d, info]) => {
      const ok = info.status !== "no_data" && info.status !== "parse_error";
      const card = document.createElement("div");
      card.className = "domain-card";
      card.innerHTML = `<div class="domain-name">${names[d]||d}</div><span class="tag ${ok?'ok':'skip'}">${ok?'有数据':'待运行'}</span>`;
      grid.appendChild(card);
    });
  } catch (e) {}
  try {
    const r = await fetch("/api/memory/state");
    const m = await r.json();
    const grid = document.getElementById("memoryGrid");
    grid.innerHTML = "";
    const stats = [
      ["工作记忆", m.working||0], ["情景记忆", m.episodic||0],
      ["语义事实", m.semantic||0], ["用户画像", m.semantic_profiles||0],
      ["待处理矛盾", m.semantic_contradictions||0], ["程序记忆", m.procedural||0],
    ];
    stats.forEach(([l,v]) => {
      const c = document.createElement("div");
      c.className = "stat-card";
      c.innerHTML = `<div class="stat-label">${l}</div><div class="stat-value">${v}</div>`;
      grid.appendChild(c);
    });
  } catch (e) {}
  try {
    const r = await fetch("/api/deploy/check");
    const d = await r.json();
    const tb = document.querySelector("#deployTable tbody");
    tb.innerHTML = "";
    (d.artifacts||[]).forEach(a => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${a.name}</td><td><span class="tag ${a.exists?'ok':'fail'}">${a.exists?'存在':'缺失'}</span></td><td style="font-size:11px;color:var(--ink-muted)">${a.path}</td>`;
      tb.appendChild(tr);
    });
  } catch (e) {}
}

function renderTestGrid() {
  const grid = document.getElementById("testGrid");
  grid.innerHTML = "";
  TEST_GROUPS.forEach(g => {
    g.tests.forEach(t => {
      const c = document.createElement("div");
      c.className = "test-card";
      c.innerHTML = `
        <div class="test-card-head">
          <span class="test-card-name">${t.name}</span>
          <span class="test-card-domain">${g.domain}</span>
        </div>
        <div class="test-card-desc">${t.desc}</div>
        <button class="test-btn" onclick="runTest('${t.cmd}', this)">运行</button>
        <div class="test-output" id="output-${t.cmd}"></div>`;
      grid.appendChild(c);
    });
  });
}

async function runTest(cmd, btn) {
  const out = document.getElementById("output-" + cmd);
  out.className = "test-output show loading";
  out.textContent = "运行中…";
  btn.disabled = true; btn.textContent = "运行中";
  try {
    const r = await fetch(`/api/cli/${cmd}`, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({timeout:90}) });
    const d = await r.json();
    out.className = "test-output show";
    out.textContent = d.ok ? (d.output || "（无输出）") : `[失败] ${d.error||d.stderr||''}\n${d.output||''}`;
  } catch (e) {
    out.className = "test-output show";
    out.textContent = "请求失败：" + e.message;
  } finally {
    btn.disabled = false; btn.textContent = "运行";
  }
}

async function loadResources() {
  try {
    const r = await fetch("/api/agents"); const d = await r.json();
    const tb = document.querySelector("#agentsTable tbody"); tb.innerHTML = "";
    (d.agents||[]).forEach(a => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td><code>${a.id}</code></td><td>${a.name}</td>`;
      tb.appendChild(tr);
    });
  } catch (e) {}
  try {
    const r = await fetch("/api/tools"); const d = await r.json();
    const tb = document.querySelector("#toolsTable tbody"); tb.innerHTML = "";
    (d.tools||[]).forEach(t => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td><code>${t.name}</code></td><td>${(t.description||'').substring(0,50)}</td>`;
      tb.appendChild(tr);
    });
  } catch (e) {}
}
</script>
